# this file is meant for Docker Swarm stacks only
# trying it in compose will fail because of multiple replicas trying to bind to the same port
# Swarm currently does not support Compose Spec, so we'll pin to the older version 3.9

version: "3.9"

services:

  redis:
    image: redis:8.4.7-alpine3.22
    networks:
      - frontend

  db:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - backend

  vote:
    image: ghcr.io/radiant-o/example-voting-app-vote:main
    ports:
      - 8080:8080
    networks:
      - frontend
    deploy:
      replicas: 2

  result:
    image: ghcr.io/radiant-o/example-voting-app-result:main
    ports:
      - 8081:8080
    networks:
      - backend

  worker:
    image: ghcr.io/radiant-o/example-voting-app-worker:main
    networks:
      - frontend
      - backend
    deploy:
      replicas: 2

networks:
  frontend:
  backend:

volumes:
  db-data:
