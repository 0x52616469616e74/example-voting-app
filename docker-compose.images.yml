# for running in docker compose with prebuilt images

# version is now using "compose spec"
# v2 and v3 are now combined!
# docker-compose v1.27+ required

services:
  vote:
    image: ghcr.io/radiant-o/example-voting-app-vote:${IMAGE_TAG:-main}
    depends_on:
      redis:
        condition: service_healthy 
    ports:
      - "8080:8080"
    networks:
      - front-tier
      - back-tier

  result:
    image: ghcr.io/radiant-o/example-voting-app-result:${IMAGE_TAG:-main}
    depends_on:
      db:
        condition: service_healthy 
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    ports:
      - "8081:8080"
    networks:
      - front-tier
      - back-tier

  worker:
    image: ghcr.io/radiant-o/example-voting-app-worker:${IMAGE_TAG:-main}
    depends_on:
      redis:
        condition: service_healthy 
      db:
        condition: service_healthy 
    environment:
      REDIS_HOST: redis
      POSTGRES_HOST: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    networks:
      - back-tier

  redis:
    image: redis:8.4.7-alpine3.22
    volumes:
      - "./healthchecks:/healthchecks"
    healthcheck:
      test: /healthchecks/redis.sh
      interval: "5s"
    networks:
      - back-tier

  db:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - "db-data:/var/lib/postgresql/data"
      - "./healthchecks:/healthchecks"
    healthcheck:
      test: /healthchecks/postgres.sh
      interval: "5s"
    networks:
      - back-tier

volumes:
  db-data:

networks:
  front-tier:
  back-tier:
