name: Capstone CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: capstone-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  validate:
    name: Validate application, Terraform, and Helm
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: vote/requirements.txt

      - name: Check Vote application
        run: |
          python -m pip install --requirement vote/requirements.txt
          python -m compileall -q vote
          PYTHONPATH=vote python -m unittest discover --start-directory vote --pattern 'test_*.py'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: result/package-lock.json

      - name: Check Result application
        working-directory: result
        run: |
          npm ci
          node --check server.js
          npm test

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Build Worker
        working-directory: worker
        run: |
          dotnet restore
          dotnet build --configuration Release --no-restore

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Validate Terraform
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.22.1

      - name: Validate Helm chart
        run: |
          helm lint ./voting-app
          helm template voting-app ./voting-app \
            --namespace voting-app \
            --set global.imageTag="${GITHUB_SHA}" \
            --set-string postgresql.auth.password=ci-placeholder > /tmp/voting-app.yaml
          test -s /tmp/voting-app.yaml
          grep -q 'runAsUser: 70' /tmp/voting-app.yaml
          grep -q 'runAsGroup: 70' /tmp/voting-app.yaml
          grep -q 'fsGroup: 70' /tmp/voting-app.yaml

      - name: Scan repository and infrastructure configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          # Exclude generated dependency trees and the upstream legacy
          # manifests; the maintained deployment path is voting-app/.
          skip-dirs: k8s-specifications,terraform/.terraform,result/node_modules
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  images:
    name: Build, scan, and publish ${{ matrix.service }}
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [vote, result, worker]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build local image for scanning
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./${{ matrix.service }}
          load: true
          push: false
          tags: capstone/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: capstone/${{ matrix.service }}:${{ github.sha }}
          format: table
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./${{ matrix.service }}
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/example-voting-app-${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/example-voting-app-${{ matrix.service }}:main
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to EKS
    needs: images
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.AWS_REGION != '' &&
      vars.EKS_CLUSTER_NAME != '' &&
      vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.22.1

      - name: Connect kubectl to EKS
        run: aws eks update-kubeconfig --region "${{ vars.AWS_REGION }}" --name "${{ vars.EKS_CLUSTER_NAME }}"

      - name: Deploy release
        run: |
          helm upgrade --install voting-app ./voting-app \
            --namespace voting-app \
            --create-namespace \
            --atomic \
            --timeout 10m \
            --set global.imageTag="${GITHUB_SHA}" \
            --set-string postgresql.auth.password="${{ secrets.POSTGRES_PASSWORD }}"

      - name: Verify rollout
        run: |
          kubectl --namespace voting-app rollout status deployment/voting-app-voting-app-vote --timeout=5m
          kubectl --namespace voting-app rollout status deployment/voting-app-voting-app-result --timeout=5m
          kubectl --namespace voting-app rollout status deployment/voting-app-voting-app-worker --timeout=5m
          kubectl --namespace voting-app get pods,services
